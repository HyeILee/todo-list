{% extends 'base.html' %}
{% block title %}기록 입력 확인 · To-do List{% endblock %}
{% block content %}<section class="form-page"><a class="back" href="{% url 'day' record_date|date:'Y-m-d' %}">← 기록으로</a><span class="eyebrow">CHECK NOTE LENGTH</span><h1>기록을 저장하지 못했습니다.</h1><p class="hint">입력한 내용은 유지했습니다. 각 항목의 글자 수를 확인해 주세요.</p><form method="post" action="{% url 'record_save' record_date %}" class="editor record-form">{% csrf_token %}<input type="hidden" name="expected_updated_at" value="{{ record_version }}">{% for field in form %}{% include "note_field.html" %}{% endfor %}<div class="form-actions"><a class="button quiet" href="{% url 'day' record_date|date:'Y-m-d' %}">취소</a><button class="button primary" type="submit">다시 저장</button></div></form></section>{% endblock %}
