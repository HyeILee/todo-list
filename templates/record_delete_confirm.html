{% extends 'base.html' %}
{% block title %}기록 삭제 확인 · To-do List{% endblock %}
{% block content %}<section class="confirm-page"><span class="eyebrow">DELETE NOTE</span><h1>이 날짜의 개인 기록을 삭제할까요?</h1><p>{{ record_date|date:'Y년 n월 j일' }}의 세 항목이 모두 비어 있습니다. 삭제하면 되돌릴 수 없습니다.</p><form method="post" action="{% url 'record_save' record_date %}">{% csrf_token %}<input type="hidden" name="expected_updated_at" value="{{ record_version }}"><input type="hidden" name="confirm_delete" value="yes"><div class="form-actions"><a class="button quiet" href="{% url 'day' record_date|date:'Y-m-d' %}">취소</a><button class="button danger" type="submit">기록 삭제</button></div></form></section>{% endblock %}
