{% extends 'base.html' %}{% block title %}로그인 · To-do List{% endblock %}{% block content %}<section class="login-wrap"><div class="login-aside"><span class="eyebrow">PERSONAL DAY LOG</span><h1>협소한 내 마음에<br>옮겨 담으려던 것은</h1><small class="login-source">- 김이듬, 〈달에서 더 멀리〉</small><p>기록은 안전한 클라우드 데이터베이스에 보관됩니다.</p></div><form method="post" class="login-form">{% csrf_token %}<h2>로그인</h2><p class="form-error" id="login-error" role="alert" {% if not form.errors %}hidden{% endif %}>아이디 또는 비밀번호를 확인해 주세요.</p><label for="id_username">아이디</label><input id="id_username" name="username" type="text" autocomplete="username" value="{{ form.username.value|default_if_none:'' }}" aria-describedby="login-error" required><label for="id_password">비밀번호</label><input id="id_password" name="password" type="password" autocomplete="current-password" aria-describedby="login-error" required><input type="hidden" name="next" value="{{ next }}"><button class="button primary wide" type="submit">로그인</button></form></section>{% endblock %}
